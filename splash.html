<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soker.Stock — جاري التحميل</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;600;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      -webkit-app-region: drag; /* Allow dragging the splash */
    }

    /* ─── Dark green radial background ─────────── */
    .splash-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 40% 40%, #0d4f38 0%, #062b20 55%, #03190f 100%);
      z-index: 0;
    }

    /* Subtle animated grain overlay */
    .splash-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.15;
      pointer-events: none;
    }

    /* ─── Floating glow orbs ─────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(52,211,153,0.12) 0%, transparent 70%);
      top: -80px; left: -80px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
      bottom: -60px; right: -60px;
      animation-delay: 3s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0,0) scale(1); }
      50%       { transform: translate(20px, -20px) scale(1.05); }
    }

    /* ─── Card ──────────────────────────────── */
    .card {
      position: relative;
      z-index: 10;
      width: clamp(380px, 40vw, 560px);
      padding: clamp(28px, 4vw, 48px) clamp(24px, 3.5vw, 44px) clamp(22px, 3vw, 36px);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(52,211,153,0.18);
      border-radius: 28px;
      box-shadow:
        0 0 0 1px rgba(52,211,153,0.06),
        0 24px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2vw, 20px);
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.88) translateY(24px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ─── Logo ──────────────────────────────── */
    .logo-wrap {
      width: clamp(80px, 12vw, 120px);
      height: clamp(80px, 12vw, 120px);
      background: linear-gradient(135deg, rgba(52,211,153,0.15) 0%, rgba(6,43,32,0.8) 100%);
      border: 1.5px solid rgba(52,211,153,0.25);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(52,211,153,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(52,211,153,0.15), inset 0 1px 0 rgba(255,255,255,0.08); }
      50%       { box-shadow: 0 8px 48px rgba(52,211,153,0.30), inset 0 1px 0 rgba(255,255,255,0.08); }
    }
    .logo-wrap img {
      width: 75%;
      height: 75%;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(52,211,153,0.3));
    }

    /* ─── Title ─────────────────────────────── */
    .title-block {
      text-align: center;
      line-height: 1;
    }
    .title-soker {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(38px, 5.5vw, 58px);
      font-weight: 900;
      color: #34d399;
      letter-spacing: -1px;
      display: inline;
    }
    .title-dot-stock {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 600;
      color: rgba(52,211,153,0.65);
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 6px;
      font-family: 'Tajawal', sans-serif;
      font-size: clamp(11px, 1.3vw, 14px);
      font-weight: 500;
      color: rgba(167,243,208,0.6);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ─── Badge ─────────────────────────────── */
    .badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.2);
      border-radius: 100px;
      font-size: clamp(10px, 1.2vw, 12px);
      font-weight: 600;
      color: rgba(167,243,208,0.75);
    }
    .badge-dot {
      width: 7px; height: 7px;
      background: #34d399;
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ─── Progress bar ──────────────────────── */
    .progress-section {
      width: 100%;
    }
    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(52,211,153,0.12);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #065f46, #34d399, #6ee7b7);
      border-radius: 100px;
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 0 10px rgba(52,211,153,0.5);
      position: relative;
      overflow: hidden;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 60px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(60px); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: translateX(-200px); opacity: 0; }
    }

    /* ─── Status row ────────────────────────── */
    .status-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .status-text {
      font-size: clamp(10px, 1.1vw, 12px);
      font-weight: 500;
      color: rgba(167,243,208,0.55);
      min-width: 180px;
    }
    .version-text {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(10px, 1.1vw, 12px);
      font-weight: 600;
      color: rgba(52,211,153,0.5);
      letter-spacing: 0.05em;
    }

    /* ─── Footer copyright ──────────────────── */
    .footer {
      font-size: clamp(9px, 1vw, 11px);
      color: rgba(255,255,255,0.2);
      font-weight: 400;
      text-align: center;
      margin-top: -4px;
    }

    /* ─── Divider ────────────────────────────── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(52,211,153,0.15), transparent);
    }
  </style>
</head>
<body>
  <div class="splash-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <!-- Logo -->
    <div class="logo-wrap">
      <img src="./public/logo.png" alt="Soker Stock Logo" />
    </div>

    <!-- App name -->
    <div class="title-block">
      <span class="title-soker">Soker</span><span class="title-dot-stock">.Stock</span>
      <div class="subtitle">نظام ادارة المخزون و الفواتير</div>
    </div>

    <!-- Secure badge -->
    <div class="badge">
      <div class="badge-dot"></div>
      نظام محمي ومشفّر بالكامل
    </div>

    <div class="divider"></div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="status-row">
        <span class="status-text" id="statusText">جاري تهيئة البيانات...</span>
        <span class="version-text">V 1.0.1</span>
      </div>
    </div>

    <!-- Copyright -->
    <div class="footer">© 2026 جميع الحقوق محفوظة لصاحب المشروع</div>
  </div>

  <script>
    const fill   = document.getElementById('progressFill');
    const status = document.getElementById('statusText');

    const steps = [
      { pct: 10, msg: 'جاري تهيئة قاعدة البيانات...',    delay: 500 },
      { pct: 28, msg: 'تحميل بيانات المنتجات...',         delay: 900 },
      { pct: 45, msg: 'تحميل بيانات العملاء...',          delay: 800 },
      { pct: 60, msg: 'تحميل بيانات الموردين...',         delay: 800 },
      { pct: 74, msg: 'تحميل الفواتير والطلبيات...',      delay: 1000 },
      { pct: 87, msg: 'تهيئة نماذج الذكاء الاصطناعي...', delay: 1200 },
      { pct: 96, msg: 'اكتمل التحميل، جاري الانطلاق...', delay: 600 },
      { pct: 100, msg: 'مرحباً بك في Soker.Stock ✓',     delay: 500 },
    ];

    let elapsed = 0;
    steps.forEach(step => {
      elapsed += step.delay;
      setTimeout(() => {
        fill.style.width   = step.pct + '%';
        status.textContent = step.msg;

        if (step.pct === 100) {
          // Signal to Electron that loading is complete
          setTimeout(() => {
            if (window.electronSplash && window.electronSplash.done) {
              window.electronSplash.done();
            }
          }, 500);
        }
      }, elapsed);
    });
  </script>
</body>
</html>
